<!DOCTYPE html>
<html>

<head>
    <title>Selenium Assignment Test Page</title>
</head>

<body>

    <h1>Selenium Web Element Identification</h1>

    <!-- Assignment 1 -->
    <div class="box">

        <h2>Assignment 1 Elements</h2>

        <input type="text" id="username" name="username" placeholder="Enter Username">

        <br><br>

        <input type="password" id="password" name="password" placeholder="Enter Password">

        <br><br>

        <button class="login-button">
            Login
        </button>

        <br><br>

        <a href="https://www.google.com">
            Google
        </a>

    </div>


    <!-- Assignment 2 -->
    <div class="box">

        <h2>Assignment 2 - Multiple Elements</h2>

        <ul>

            <li>
                <a href="https://www.google.com">Google</a>
            </li>

            <li>
                <a href="https://www.github.com">GitHub</a>
            </li>

            <li>
                <a href="https://www.python.org">Python</a>
            </li>

            <li>
                <a href="https://www.selenium.dev">Selenium</a>
            </li>

        </ul>

    </div>


    <!-- Assignment 3 -->
    <div class="box">

        <h2>Assignment 3 - CSS Selector</h2>

        <input type="text" id="user_name" placeholder="User Name">

        <br><br>

        <input type="email" id="user_email" placeholder="User Email">

        <br><br>

        <input type="text" id="user_phone" placeholder="User Phone">

        <br><br>

        <input type="text" id="admin_name" placeholder="Admin Name">

    </div>


    <!-- Assignment 4 -->
    <div class="box">

        <h2>Assignment 4 - Child Nodes</h2>

        <div id="button-container">

            <button class="child-button">
                Child Button
            </button>

        </div>

    </div>

</body>

</html>
